on:
  push:
  pull_request:

name: ci

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        persist-credentials: false
    - name: Confirm Apple Silicon runner
      run: test "$(uname -m)" = arm64
    - name: Install build dependencies
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: brew bundle --file=macos/Brewfile --no-lock
    - name: Test macOS library and app
      run: cargo test --locked -p popsicle -p popsicle_gtk
    - name: Build and verify portable app
      run: macos/build-app.sh

  appimage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        fetch-depth: 0
        set-safe-directory: '*'
    - run: docker run --rm -v "$PWD:/github/workspace" -w "/github/workspace" rust:1.75.0-buster bash appimage.sh
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        if-no-files-found: error
        name: popsicle-appimage-${{ github.sha }}
        path: Popsicle_USB_Flasher-*.AppImage*

on:
  push:
  pull_request:

name: ci

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Confirm Apple Silicon runner
      run: test "$(uname -m)" = arm64
    - name: Install build dependencies
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: brew bundle --file=macos/Brewfile
    - name: Test macOS library and app
      run: cargo test --locked -p popsicle -p popsicle_gtk -p popsicle_cli
    - name: Build and verify portable app
      run: macos/build-app.sh
